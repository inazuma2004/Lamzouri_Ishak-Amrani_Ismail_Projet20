[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "incidents-app"
version = "0.1.0"
description = "Agent autonome de classification et de résolution de tickets d'incidents IT"
requires-python = ">=3.11"
authors = [
    {name = "Lamzouri Ishak", email = "lamzouriishak@gmail.com"},
    {name = "Amrani Ismail",  email = "amranix33@gmail.com"},
]
dependencies = [
    "scikit-learn>=1.9,<1.10",  # le modèle se relit avec la version qui l'a produit
    "joblib>=1.3",
    "pandas>=2.0",
    "click>=8.1",
    "fastapi>=0.110",
    "uvicorn>=0.29",
    "httpx>=0.27",
    "streamlit>=1.35",
    "plotly>=6",
    "pydantic>=2.0",
    "python-dotenv>=1.2.2",
    "sentence-transformers>=3.0",
    "chromadb>=0.5",
]

[project.scripts]
incidents = "incidents_app.cli:main"

[tool.setuptools.packages.find]
include = ["incidents_app*"]

[tool.pytest.ini_options]
pythonpath = ["src"]  # train.py ; le paquet vient de pip install -e .
asyncio_mode = "strict"
asyncio_default_fixture_loop_scope = "function"
addopts = "-q --import-mode=importlib"  # les sources ne masquent jamais la roue installée

[tool.ruff]
line-length = 100

[tool.mypy]
python_version = "3.11"
check_untyped_defs = true
warn_unused_ignores = true

[[tool.mypy.overrides]]
module = ["joblib", "joblib.*", "sklearn", "sklearn.*", "pandas", "pandas.*", "uvicorn", "uvicorn.*", "click", "click.*", "chromadb", "chromadb.*", "sentence_transformers", "sentence_transformers.*", "mlflow", "mlflow.*", "plotly", "plotly.*", "yaml", "yaml.*", "streamlit.*"]
ignore_missing_imports = true
