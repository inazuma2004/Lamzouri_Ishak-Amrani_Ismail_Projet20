[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "incidents-app"
version = "0.6.0"
description = "Agent autonome de classification de tickets d'incidents IT"
requires-python = ">=3.11"
authors = [
    {name = "Lamzouri Ishak", email = "lamzouriishak@gmail.com"},
    {name = "Amrani Ismail",  email = "amranix33@gmail.com"},
]
dependencies = [
    "scikit-learn>=1.4",
    "joblib>=1.3",
    "pandas>=2.0",
    "click>=8.1",
    "fastapi>=0.110",
    "uvicorn>=0.29",
    "httpx>=0.27",
    "streamlit>=1.35",
    "pydantic>=2.0",
]

[project.scripts]
incidents = "src.cli:main"

# La roue contient le paquet, l'API et l'interface. Ni tests, ni donnees, ni modele.
[tool.setuptools.packages.find]
include = ["src*", "app*", "ui*"]

[tool.pytest.ini_options]
pythonpath = ["."]
asyncio_mode = "strict"
addopts = "-q"

[tool.ruff]
line-length = 100
