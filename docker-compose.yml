# docker-compose.yml — Semaine 6 : Déploiement local

services:
  api:
    build: .
    ports:
      - "8000:8000"
    environment:
      - INCIDENTS_MODELE=/app/models/incidents.joblib
      - API_URL=http://localhost:8000
    volumes:
      # Monter le modèle entraîné (exclu de Git, présent localement)
      - ./models:/app/models:ro
    restart: unless-stopped

  ui:
    build: .
    ports:
      - "8501:8501"
    environment:
      - API_URL=http://api:8000
    depends_on:
      - api
    command: >
      sh -c "streamlit run ui/app.py --server.address 0.0.0.0 --server.port 8501"
    restart: unless-stopped
